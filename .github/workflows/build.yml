name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            arch: arm64
          - name: Windows x64
            os: windows-latest
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        env:
          M_ARCH: ${{ matrix.arch }}
          USE_HARD_LINKS: false
        run: pnpm run dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.zip
            build/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
